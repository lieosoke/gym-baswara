services:
  - type: web
    name: gymbaswara-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: gymbaswara
      - key: JWT_SECRET
        sync: false
      - key: JWT_TTL_HOURS
        value: "720"
